# Длина волны для анализа (нм), выбирается вручную по спектрам
# калибровочных растворов (например, там, где виден чёткий пик поглощения).
wavelength_nm: 270

# Папки с исходными данными и для результатов (пути относительно корня проекта).
calibration_folder: "data/calibration"
samples_folder: "data/samples"
output_folder: "results"
